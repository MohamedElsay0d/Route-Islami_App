name: islami_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  adhan: ^2.0.0+1
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.2
  geolocator: ^14.1.2
  intl: ^0.20.3
  just_audio: ^0.10.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/PNG/
    - assets/images/SVG/
  fonts:
    - family: JannaLT
      fonts:
        - asset: asset/fonts/JannalLT-Bold.ttf
          weight: 700
